    rel="stylesheet" />

  <!-- Single Page Apps for GitHub Pages: Mengembalikan URL routing asli sebelum React Router dimuat -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- Link langsung ke styles.css agar selalu terbaca dan dimuat oleh browser -->
  <link rel="stylesheet" href="/src/styles.css" />
